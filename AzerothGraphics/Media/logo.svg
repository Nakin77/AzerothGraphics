<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Azeroth Graphics: a dusk landscape whose golden horizon is a slider track
       and whose sun is the slider thumb (view distance, graphics tuning). -->
  <defs>
    <linearGradient id="fg-sky" x1="0" y1="40" x2="0" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#091731"/>
      <stop offset="0.6" stop-color="#1B4A78"/>
      <stop offset="1" stop-color="#E8964A"/>
    </linearGradient>
    <linearGradient id="fg-ground" x1="0" y1="318" x2="0" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21502C"/>
      <stop offset="1" stop-color="#0A1D10"/>
    </linearGradient>
    <linearGradient id="fg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEB9C"/>
      <stop offset="0.45" stop-color="#FFD100"/>
      <stop offset="1" stop-color="#A36A00"/>
    </linearGradient>
    <radialGradient id="fg-sun" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#FFF6CC"/>
      <stop offset="0.55" stop-color="#FFD100"/>
      <stop offset="1" stop-color="#D98A00"/>
    </radialGradient>
    <radialGradient id="fg-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fg-inside">
      <rect x="40" y="40" width="432" height="432" rx="74"/>
    </clipPath>
  </defs>

  <!-- Frame -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="#120F0D"/>

  <g clip-path="url(#fg-inside)">
    <!-- Sky and stars -->
    <rect x="40" y="40" width="432" height="278" fill="url(#fg-sky)"/>
    <g fill="#FFFFFF">
      <circle cx="92" cy="86" r="3" opacity="0.9"/>
      <circle cx="150" cy="124" r="2" opacity="0.7"/>
      <circle cx="252" cy="70" r="2.5" opacity="0.8"/>
      <circle cx="318" cy="104" r="3" opacity="0.9"/>
      <circle cx="396" cy="72" r="2" opacity="0.7"/>
      <circle cx="438" cy="138" r="2.5" opacity="0.8"/>
      <circle cx="364" cy="160" r="1.8" opacity="0.6"/>
    </g>
    <circle cx="340" cy="318" r="130" fill="url(#fg-glow)"/>

    <!-- Far mountains -->
    <polygon fill="#4A7298" opacity="0.85"
      points="40,318 40,250 95,205 140,238 205,160 262,226 300,204 360,262 410,238 472,274 472,318"/>
    <polygon fill="#E6EEF5" opacity="0.75"
      points="205,160 224,182 214,178 206,187 198,178 187,182"/>

    <!-- Near mountains -->
    <polygon fill="#11253B"
      points="40,318 40,290 120,212 170,252 232,176 300,262 336,240 400,318"/>
    <polygon fill="#F5F1E6"
      points="232,176 255,205 244,200 236,209 226,199 217,205 208,205"/>
    <polygon fill="#F5F1E6" opacity="0.85"
      points="120,212 136,228 128,226 121,233 113,226 105,227"/>

    <!-- Ground -->
    <rect x="40" y="318" width="432" height="154" fill="url(#fg-ground)"/>
    <path d="M40 352 Q150 330 262 348 T472 340 L472 480 L40 480 Z" fill="#2E6B3A" opacity="0.7"/>
    <path d="M40 412 Q170 378 300 402 T472 392 L472 480 L40 480 Z" fill="#14361D"/>

    <!-- Horizon = slider: dim track, gold fill up to the sun -->
    <rect x="40" y="314" width="432" height="8" fill="#FFD100" opacity="0.3"/>
    <rect x="30" y="311" width="310" height="14" fill="url(#fg-gold)"/>

    <!-- Grass -->
    <g fill="#3B8A38">
      <path d="M76 480 Q92 420 104 368 Q100 430 96 480 Z"/>
      <path d="M118 480 Q130 444 150 416 Q140 450 136 480 Z"/>
      <path d="M408 480 Q406 418 420 366 Q426 428 428 480 Z"/>
      <path d="M446 480 Q458 444 480 426 Q468 456 462 480 Z"/>
      <path d="M262 480 Q270 448 286 428 Q278 456 278 480 Z"/>
    </g>
    <g fill="#6CC24A">
      <path d="M56 480 Q70 430 56 380 Q84 428 80 480 Z"/>
      <path d="M94 480 Q104 440 128 402 Q116 444 114 480 Z"/>
      <path d="M388 480 Q382 440 362 408 Q392 436 408 480 Z"/>
      <path d="M428 480 Q440 430 464 394 Q452 440 448 480 Z"/>
      <path d="M218 480 Q226 450 212 428 Q238 448 236 480 Z"/>
    </g>
  </g>

  <!-- Sun = slider thumb -->
  <circle cx="340" cy="318" r="40" fill="url(#fg-sun)" stroke="#120F0D" stroke-width="7"/>

  <!-- Gold border -->
  <rect x="40" y="40" width="432" height="432" rx="74" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#fg-gold)" stroke-width="18"/>
</svg>
